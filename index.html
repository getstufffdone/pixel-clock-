<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Flip Clock + Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF6E3; --grid:rgba(0,0,0,.05);
  --card:#F7C9D8; --card2:#EFB4C8;
  --num:#4A3B45; --accent:#E86A7C; --sub:#9A8892; --star:#F2C94C;
  --shadow:rgba(74,59,69,.18);
  --fishDark:#F0845C; --fishMid:#FFB48A; --fishLight:#FFE9D8; --fishEye:#4A3B45;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Mali',system-ui,sans-serif;
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;transition:background-color .4s ease;
  image-rendering:pixelated;
}
.wrap{text-align:center;padding:16px 18px 10px;position:relative;width:100%}
.date{margin-bottom:11px;font-size:clamp(11px,3vw,15px);color:var(--sub);font-weight:600;letter-spacing:.3px}
.clock{display:flex;justify-content:center;align-items:flex-start;gap:10px}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px}
.label{font-family:'Silkscreen',monospace;font-size:9px;color:var(--sub);letter-spacing:1px}
.flip{
  position:relative;width:clamp(74px,22vw,118px);height:clamp(64px,20vw,106px);
  perspective:600px;font-family:'Silkscreen',monospace;font-weight:700;
  filter:drop-shadow(0 3px 0 var(--shadow));
}
.card{position:absolute;left:0;width:100%;height:50%;overflow:hidden;
  background:var(--card);color:var(--num);display:flex;justify-content:center}
.card .d{height:clamp(64px,20vw,106px);line-height:clamp(64px,20vw,106px);
  font-size:clamp(34px,10vw,58px);letter-spacing:2px}
.top{top:0;border-radius:12px 12px 0 0;border-bottom:2px solid rgba(0,0,0,.08)}
.bottom{bottom:0;border-radius:0 0 12px 12px;background:var(--card2)}
.bottom .d{transform:translateY(-50%)}
.flip-top,.flip-bottom{display:none}
.flip.go .flip-top,.flip.go .flip-bottom{display:flex}
.flip.go .flip-top{top:0;border-radius:12px 12px 0 0;transform-origin:bottom;animation:flipTop .3s ease-in forwards;z-index:3}
.flip.go .flip-bottom{bottom:0;border-radius:0 0 12px 12px;background:var(--card2);
  transform-origin:top;transform:rotateX(90deg);animation:flipBot .3s .3s ease-out forwards;z-index:3}
.flip.go .flip-bottom .d{transform:translateY(-50%)}
@keyframes flipTop{to{transform:rotateX(-90deg)}}
@keyframes flipBot{to{transform:rotateX(0)}}
.colon{font-family:'Silkscreen',monospace;font-size:clamp(18px,6vw,30px);color:var(--accent);
  align-self:center;margin-top:14px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.stage{position:relative;height:26px;margin-top:10px;overflow:hidden}
.fish{position:absolute;bottom:3px;width:34px;animation:run 10s linear infinite,swim .9s ease-in-out infinite}
.fish:nth-child(2){animation-delay:-3.3s,-.3s;width:28px;opacity:.85;--fishDark:#E4708A;--fishMid:#F9A8BC;--fishLight:#FDE3EB}
.fish:nth-child(3){animation-delay:-6.6s,-.6s;width:23px;opacity:.7;--fishDark:#5E9FD4;--fishMid:#9FD0EF;--fishLight:#E4F2FC}
@keyframes run{from{left:-16%}to{left:112%}}
@keyframes swim{
  0%,100%{transform:scaleX(-1) translateY(0) rotate(0deg)}
  50%{transform:scaleX(-1) translateY(-4px) rotate(4deg)}
}
.dust{position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--star);opacity:.5;animation:dust 10s linear infinite}
.dust:nth-child(5){animation-delay:-3.3s}
.dust:nth-child(6){animation-delay:-6.6s}
@keyframes dust{from{left:-18%;opacity:.6;bottom:2px}to{left:110%;opacity:0;bottom:16px}}
.spark{position:absolute;font-family:'Silkscreen',monospace;color:var(--star);pointer-events:none;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.cd{
  margin-top:10px;padding:11px 14px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--card) 42%,transparent);
  border:2px dashed color-mix(in srgb,var(--num) 22%,transparent);
  display:inline-block;min-width:min(96%,460px);position:relative;
}
.cd-title{font-family:'Silkscreen',monospace;font-size:10px;color:var(--accent);letter-spacing:1px;margin-bottom:8px}
.cd-title span{color:var(--sub)}
.cd-row{display:flex;justify-content:center;gap:7px;align-items:flex-end}
.cd-box{background:var(--card2);border-radius:9px;padding:7px 13px 6px;min-width:68px;box-shadow:0 2px 0 var(--shadow)}
.cd-n{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(16px,4.6vw,22px);color:var(--num);line-height:1.1;letter-spacing:1px}
.cd-l{font-family:'Silkscreen',monospace;font-size:7px;color:var(--num);opacity:.6;letter-spacing:1px;margin-top:3px}
.bar{height:6px;border-radius:6px;margin-top:10px;overflow:hidden;background:color-mix(in srgb,var(--num) 12%,transparent)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s ease;border-radius:6px}
.cd-done{font-family:'Silkscreen',monospace;font-size:12px;color:var(--accent);padding:8px 0}
.cd-edit{position:absolute;top:6px;right:9px;font-family:'Silkscreen',monospace;font-size:8px;color:var(--sub);cursor:pointer;opacity:0;transition:opacity .2s}
.cd:hover .cd-edit{opacity:1}
.cd-form{display:none;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.cd-form.open{display:flex}
.cd-form input{font-family:'Mali',sans-serif;font-size:11px;padding:5px 8px;border-radius:7px;
  border:2px solid color-mix(in srgb,var(--num) 18%,transparent);background:var(--bg);color:var(--num);outline:none}
.cd-form input[type=text]{width:140px}
.cd-form button{font-family:'Silkscreen',monospace;font-size:9px;padding:6px 12px;border:none;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer}
.picker{margin-top:9px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity .25s}
body:hover .picker{opacity:1}
.sw{width:18px;height:18px;cursor:pointer;border:2px solid rgba(0,0,0,.15);transition:transform .12s}
.sw:hover,.sw.on{transform:scale(1.25)}
.sw.on{border-color:var(--num)}
.fmt{position:absolute;top:2px;right:10px;font-family:'Silkscreen',monospace;font-size:9px;color:var(--sub);cursor:pointer;user-select:none;opacity:0;transition:opacity .25s}
body:hover .fmt{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="fmt" id="fmt">24H</div>
  <div class="spark" style="top:34px;left:10%;font-size:13px">✦</div>
  <div class="spark" style="top:52px;right:12%;font-size:10px;animation-delay:.8s">✦</div>
  <div class="spark" style="top:92px;left:5%;font-size:9px;animation-delay:1.4s">✧</div>

  <div class="date" id="date">—</div>
  <div class="clock" id="clock"></div>
  <div class="stage" id="stage"></div>

  <div class="cd">
    <div class="cd-edit" id="cdEdit">EDIT</div>
    <div class="cd-title" id="cdTitle">DEADLINE</div>
    <div id="cdBody">
      <div class="cd-row">
        <div class="cd-box"><div class="cd-n" id="dd">00</div><div class="cd-l">DAYS</div></div>
        <div class="cd-box"><div class="cd-n" id="hh">00</div><div class="cd-l">HOURS</div></div>
        <div class="cd-box"><div class="cd-n" id="mm">00</div><div class="cd-l">MINUTES</div></div>
        <div class="cd-box"><div class="cd-n" id="ss">00</div><div class="cd-l">SEC</div></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="cd-form" id="cdForm">
      <input type="text" id="inTitle" placeholder="ชื่องาน เช่น ส่งโปรเจกต์">
      <input type="datetime-local" id="inDate">
      <button id="saveBtn">SAVE</button>
    </div>
  </div>

  <div class="picker" id="picker"></div>
</div>

<script>
/* safe storage */
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

const THEMES=[
 {n:'Strawberry Milk',bg:'#FDF6E3',grid:'rgba(0,0,0,.05)',card:'#F7C9D8',card2:'#EFB4C8',num:'#4A3B45',accent:'#E86A7C',sub:'#9A8892',star:'#F2C94C'},
 {n:'Mint Soda',bg:'#F0FAF4',grid:'rgba(0,80,60,.06)',card:'#BFE8D4',card2:'#A5DCC4',num:'#24503F',accent:'#3FA37A',sub:'#7CA396',star:'#F6D976'},
 {n:'Lavender',bg:'#F6F2FC',grid:'rgba(80,60,120,.06)',card:'#DCD0F2',card2:'#CBBBEB',num:'#45375E',accent:'#8B6FD1',sub:'#9B90B4',star:'#FFD98E'},
 {n:'Sky Bubble',bg:'#F0F7FE',grid:'rgba(40,80,120,.06)',card:'#C6E2F7',card2:'#AED4F0',num:'#2F4A63',accent:'#4E96D1',sub:'#87A2B8',star:'#FFE08A'},
 {n:'Butter Cream',bg:'#FEFAEC',grid:'rgba(120,100,40,.07)',card:'#FBE3AE',card2:'#F6D68E',num:'#5A4A2A',accent:'#E0A63C',sub:'#A99775',star:'#E86A7C'},
 {n:'Peach Fuzz',bg:'#FFF4EE',grid:'rgba(120,70,50,.06)',card:'#FBD3BE',card2:'#F6BFA4',num:'#5E3E30',accent:'#E8825A',sub:'#AE9083',star:'#F2C94C'},
 {n:'Sage Paper',bg:'#F5F5EE',grid:'rgba(60,70,50,.07)',card:'#D8DFC8',card2:'#C6CFB3',num:'#3F4635',accent:'#7A8A5E',sub:'#909682',star:'#E3B94C'},
 {n:'Return (ครีม)',bg:'#FDF8E7',grid:'rgba(0,0,0,.045)',card:'#EFE8CF',card2:'#E4DBBC',num:'#1E1E1E',accent:'#D93A3A',sub:'#8C8570',star:'#F2C94C'},
 {n:'Pixel Grid',bg:'#2E2E2E',grid:'rgba(150,180,120,.16)',card:'#F7D6E0',card2:'#EDC2D0',num:'#2E2E2E',accent:'#F7D6E0',sub:'#9E9E9E',star:'#C9E265'},
 {n:'Night Cotton',bg:'#242038',grid:'rgba(255,255,255,.06)',card:'#8A7BB8',card2:'#7869A6',num:'#F4F1FA',accent:'#FFC4DD',sub:'#9E95BF',star:'#FFE08A'}
];

const FISH=`<svg class="fish" viewBox="0 0 14 11" shape-rendering="crispEdges">
  <g fill="var(--fishMid)">
    <rect x="5" y="0" width="2" height="1"/><rect x="4" y="1" width="4" height="1"/><rect x="6" y="2" width="2" height="1"/>
    <rect x="3" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="5" y="5" width="2" height="1"/>
    <rect x="2" y="6" width="2" height="1"/><rect x="8" y="6" width="1" height="1"/>
    <rect x="4" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/>
    <rect x="4" y="8" width="2" height="1"/><rect x="7" y="8" width="1" height="1"/><rect x="5" y="9" width="1" height="1"/>
  </g>
  <g fill="var(--fishDark)">
    <rect x="2" y="2" width="4" height="1"/><rect x="1" y="3" width="7" height="1"/>
    <rect x="0" y="4" width="2" height="1"/><rect x="6" y="4" width="3" height="1"/>
    <rect x="0" y="5" width="3" height="1"/><rect x="7" y="5" width="2" height="1"/>
  </g>
  <g fill="var(--fishLight)">
    <rect x="4" y="5" width="1" height="1"/><rect x="4" y="6" width="4" height="1"/><rect x="5" y="7" width="2" height="1"/>
  </g>
  <g fill="var(--fishMid)">
    <rect x="11" y="1" width="2" height="1"/><rect x="10" y="2" width="2" height="1"/><rect x="9" y="3" width="3" height="1"/>
    <rect x="9" y="4" width="2" height="1"/><rect x="9" y="5" width="2" height="1"/><rect x="9" y="6" width="1" height="1"/>
    <rect x="10" y="7" width="2" height="1"/><rect x="11" y="8" width="2" height="1"/>
  </g>
  <rect x="2" y="4" width="1" height="1" fill="var(--fishEye)"/>
</svg>`;
document.getElementById('stage').innerHTML=FISH+FISH+FISH+'<div class="dust"></div><div class="dust"></div><div class="dust"></div>';

const UNITS=[['h','HOUR'],['m','MIN']];
const clock=document.getElementById('clock');
UNITS.forEach(([k,lab],i)=>{
  if(i) clock.insertAdjacentHTML('beforeend','<div class="colon">:</div>');
  clock.insertAdjacentHTML('beforeend',`
    <div class="unit">
      <div class="flip" id="u-${k}">
        <div class="card top"><span class="d">00</span></div>
        <div class="card bottom"><span class="d">00</span></div>
        <div class="card flip-top"><span class="d">00</span></div>
        <div class="card flip-bottom"><span class="d">00</span></div>
      </div>
      <div class="label">${lab}</div>
    </div>`);
});
function flipTo(el,val){
  if(el.dataset.v===val) return;
  const old=el.dataset.v ?? val; el.dataset.v=val;
  el.querySelector('.top .d').textContent=val;
  el.querySelector('.bottom .d').textContent=old;
  el.querySelector('.flip-top .d').textContent=old;
  el.querySelector('.flip-bottom .d').textContent=val;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  setTimeout(()=>{el.querySelector('.bottom .d').textContent=val;},590);
}

const root=document.documentElement, picker=document.getElementById('picker');
function applyTheme(i){
  const t=THEMES[i]||THEMES[0];
  ['bg','grid','card','card2','num','accent','sub','star'].forEach(k=>root.style.setProperty('--'+k,t[k]));
  store.set('pixclock_theme',i);
  [...picker.children].forEach((el,x)=>el.classList.toggle('on',x===i));
}
THEMES.forEach((t,i)=>{
  const b=document.createElement('div');
  b.className='sw'; b.title=t.n;
  b.style.background=`linear-gradient(135deg,${t.card} 50%,${t.bg} 50%)`;
  b.onclick=()=>applyTheme(i);
  picker.appendChild(b);
});

const CD_KEY='pixclock_cd';
const $=id=>document.getElementById(id);
function localISO(ms){
  const d=new Date(ms); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
let cd=null;
try{cd=JSON.parse(store.get(CD_KEY)||'null')}catch(e){}
cd=cd||{title:'DEADLINE',target:localISO(Date.now()+7*864e5),start:Date.now()};
$('cdEdit').onclick=()=>{
  $('cdForm').classList.toggle('open');
  $('inTitle').value=cd.title; $('inDate').value=cd.target;
};
$('saveBtn').onclick=()=>{
  cd={title:($('inTitle').value||'DEADLINE').toUpperCase(),target:$('inDate').value||cd.target,start:Date.now()};
  store.set(CD_KEY,JSON.stringify(cd));
  $('cdForm').classList.remove('open');
  location.reload();
};
function tickCD(){
  const end=new Date(cd.target).getTime();
  if(isNaN(end)) return;
  const diff=end-Date.now();
  if(diff<=0){
    $('cdBody').innerHTML='<div class="cd-done">TIME\'S UP !  ✦</div>';
    $('cdTitle').innerHTML=cd.title+' <span>· Target Reached</span>'; return;
  }
  const d=Math.floor(diff/864e5),h=Math.floor(diff/36e5)%24,m=Math.floor(diff/6e4)%60,s=Math.floor(diff/1e3)%60;
  const pp=n=>String(n).padStart(2,'0');
  if($('dd')){$('dd').textContent=pp(d);$('hh').textContent=pp(h);$('mm').textContent=pp(m);$('ss').textContent=pp(s);}
  $('cdTitle').innerHTML=cd.title+' <span>· '+d+' days left</span>';
  const total=end-cd.start;
  if($('bar')&&total>0) $('bar').style.width=Math.min(100,Math.max(0,(1-diff/total)*100))+'%';
}

let is24=store.get('pixclock_fmt')!=='12';
$('fmt').onclick=()=>{is24=!is24;store.set('pixclock_fmt',is24?'24':'12');tick();};
const p=n=>String(n).padStart(2,'0');
function tick(){
  const now=new Date();
  let h=now.getHours(); if(!is24) h=h%12||12;
  flipTo($('u-h'),p(h));
  flipTo($('u-m'),p(now.getMinutes()));
  $('date').textContent=
    now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})
    +(is24?'':(now.getHours()>=12?'  ·  PM':'  ·  AM'));
  $('fmt').textContent=is24?'24H':'12H';
  tickCD();
}
applyTheme(Number(store.get('pixclock_theme'))||0);
tick(); setInterval(tick,1000);
</script>
</body>
</html>
